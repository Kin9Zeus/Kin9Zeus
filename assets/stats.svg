<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Eleven public projects, more than 850 commits on GitHub, six sites and agents live in production, Lighthouse 100 on desktop.">
<title>Eleven public projects, more than 850 commits on GitHub, six sites and agents live in production, Lighthouse 100 on desktop.</title>
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace} .blk{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif}
  @keyframes line{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
  @keyframes pop{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
<g transform="translate(0 0)">
  <rect width="298.5" height="190" fill="#0B0C0A" stroke="#F2F4EF" stroke-opacity=".07"/>
  <clipPath id="t0"><rect width="298.5" height="190"/></clipPath>
  <g clip-path="url(#t0)"><rect y="187" width="298.5" height="3" fill="#EFFF00" style="animation:line 5s 0s ease-in-out infinite"/></g>
  <text class="blk" x="30" y="108" font-size="74" fill="#F2F4EF" style="animation:pop .9s 0.1s cubic-bezier(.16,1,.3,1) both">11</text>
  <rect x="30" y="140" width="8" height="8" fill="#EFFF00" style="animation:pulse 2.4s 0s ease-in-out infinite"/>
  <text class="mono" x="50" y="149" font-size="13" letter-spacing="3.4" fill="#8B9084">PUBLIC PROJECTS</text>
</g>
<g transform="translate(300.5 0)">
  <rect width="298.5" height="190" fill="#0B0C0A" stroke="#F2F4EF" stroke-opacity=".07"/>
  <clipPath id="t1"><rect width="298.5" height="190"/></clipPath>
  <g clip-path="url(#t1)"><rect y="187" width="298.5" height="3" fill="#EFFF00" style="animation:line 5s 0.7s ease-in-out infinite"/></g>
  <text class="blk" x="30" y="108" font-size="74" fill="#F2F4EF" style="animation:pop .9s 0.22s cubic-bezier(.16,1,.3,1) both">850+</text>
  <rect x="30" y="140" width="8" height="8" fill="#EFFF00" style="animation:pulse 2.4s 0.4s ease-in-out infinite"/>
  <text class="mono" x="50" y="149" font-size="13" letter-spacing="3.4" fill="#8B9084">COMMITS ON GITHUB</text>
</g>
<g transform="translate(601 0)">
  <rect width="298.5" height="190" fill="#0B0C0A" stroke="#F2F4EF" stroke-opacity=".07"/>
  <clipPath id="t2"><rect width="298.5" height="190"/></clipPath>
  <g clip-path="url(#t2)"><rect y="187" width="298.5" height="3" fill="#EFFF00" style="animation:line 5s 1.4s ease-in-out infinite"/></g>
  <text class="blk" x="30" y="108" font-size="74" fill="#F2F4EF" style="animation:pop .9s 0.33999999999999997s cubic-bezier(.16,1,.3,1) both">6</text>
  <rect x="30" y="140" width="8" height="8" fill="#EFFF00" style="animation:pulse 2.4s 0.8s ease-in-out infinite"/>
  <text class="mono" x="50" y="149" font-size="13" letter-spacing="3.4" fill="#8B9084">SITES &amp; AGENTS LIVE</text>
</g>
<g transform="translate(901.5 0)">
  <rect width="298.5" height="190" fill="#0B0C0A" stroke="#F2F4EF" stroke-opacity=".07"/>
  <clipPath id="t3"><rect width="298.5" height="190"/></clipPath>
  <g clip-path="url(#t3)"><rect y="187" width="298.5" height="3" fill="#EFFF00" style="animation:line 5s 2.0999999999999996s ease-in-out infinite"/></g>
  <text class="blk" x="30" y="108" font-size="74" fill="#F2F4EF" style="animation:pop .9s 0.45999999999999996s cubic-bezier(.16,1,.3,1) both">100</text>
  <rect x="30" y="140" width="8" height="8" fill="#EFFF00" style="animation:pulse 2.4s 1.2000000000000002s ease-in-out infinite"/>
  <text class="mono" x="50" y="149" font-size="13" letter-spacing="3.4" fill="#8B9084">LIGHTHOUSE · DESKTOP</text>
</g>
</svg>
